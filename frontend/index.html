<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>PADD</title>

  <!-- Highlight.js themes (local) -->
  <link id="hljs-light" rel="stylesheet" href="./lib/github.min.css" disabled>
  <link id="hljs-dark" rel="stylesheet" href="./lib/github-dark.min.css">

  <style>
    /* ===== Theme Variables ===== */
    :root {
      --bg: #ffffff;
      --bg-surface: #f6f8fa;
      --text: #24292f;
      --text-secondary: #656d76;
      --border: #d0d7de;
      --link: #0969da;
      --heading: #1f2328;
      --code-bg: #f6f8fa;
      --toolbar-bg: #f0f0f0;
      --toolbar-border: #d0d7de;
      --blockquote-border: #d0d7de;
      --blockquote-text: #656d76;
      --table-border: #d0d7de;
      --table-alt: #f6f8fa;
      --drop-bg: rgba(0,0,0,0.03);
      --drop-border: #c0c0c0;
      --scrollbar-thumb: #c0c0c0;
      --scrollbar-hover: #999;
      --tab-inactive-bg: #e4e6ea;
      --tab-active-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg: #2b2b2b;
      --bg-surface: #333333;
      --text: #d4d4d4;
      --text-secondary: #999999;
      --border: #444444;
      --link: #6cb6ff;
      --heading: #e6e6e6;
      --code-bg: #1e1e1e;
      --toolbar-bg: #252525;
      --toolbar-border: #3a3a3a;
      --blockquote-border: #555555;
      --blockquote-text: #999999;
      --table-border: #444444;
      --table-alt: #333333;
      --drop-bg: rgba(255,255,255,0.03);
      --drop-border: #555555;
      --scrollbar-thumb: #555;
      --scrollbar-hover: #777;
      --tab-inactive-bg: #2f2f2f;
      --tab-active-bg: #2b2b2b;
    }

    /* ===== Reset & Base ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Toolbar ===== */
    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px;
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--toolbar-border);
      -webkit-app-region: drag;
      flex-shrink: 0;
      user-select: none;
      min-height: 38px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #toolbar button {
      -webkit-app-region: no-drag;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      line-height: 1.4;
    }

    #toolbar button:hover {
      background: var(--bg-surface);
    }

    #toolbar button:active {
      opacity: 0.7;
    }

    #toolbar button:disabled,
    #tabbar button:disabled {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }

    .zoom-btn {
      min-width: 28px;
      text-align: center;
      font-weight: 600;
    }

    #app-brand {
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0.5px;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    #zoom-level {
      font-size: 11px;
      color: var(--text-secondary);
      min-width: 36px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      transition: color 0.2s ease;
    }

    /* ===== Window Controls ===== */
    .win-ctrl {
      -webkit-app-region: no-drag;
      background: none;
      border: none !important;
      color: var(--text);
      padding: 0 12px;
      cursor: pointer;
      font-size: 13px;
      height: 100%;
      min-height: 38px;
      line-height: 38px;
      transition: background 0.1s;
    }
    .win-ctrl:hover { background: rgba(128,128,128,0.2); }
    .win-close:hover { background: #e81123 !important; color: white !important; }

    /* ===== Tab Bar ===== */
    #tabbar {
      display: flex;
      align-items: center;
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--toolbar-border);
      padding: 0 8px;
      flex-shrink: 0;
      min-height: 32px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-app-region: no-drag;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    #tabbar.hidden { display: none; }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 12px;
      margin: 4px 2px 0 0;
      border: 1px solid var(--toolbar-border);
      border-bottom: none;
      border-radius: 5px 5px 0 0;
      background: var(--tab-inactive-bg);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      max-width: 220px;
      user-select: none;
    }

    .tab:hover { color: var(--text); }

    .tab.active {
      background: var(--tab-active-bg);
      color: var(--text);
      border-bottom: 1px solid var(--tab-active-bg);
      margin-bottom: -1px;
    }

    .tab-name {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .tab.dirty .tab-name::before {
      content: '• ';
      color: var(--link);
      font-weight: bold;
    }

    .tab-close {
      background: none;
      border: none !important;
      color: inherit;
      padding: 0 4px !important;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      border-radius: 3px;
      opacity: 0.6;
    }
    .tab-close:hover {
      opacity: 1;
      background: rgba(128,128,128,0.3) !important;
    }

    #new-tab-btn {
      background: none;
      border: none !important;
      color: var(--text-secondary);
      font-size: 18px;
      padding: 0 10px !important;
      cursor: pointer;
      line-height: 1;
      flex-shrink: 0;
    }
    #new-tab-btn:hover { color: var(--text); background: none !important; }

    /* ===== Content Area ===== */
    #content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    body.edit-mode #content {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== Drop Zone ===== */
    #drop-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      padding: 40px;
      text-align: center;
      transition: background 0.2s ease;
    }

    #drop-zone.drag-over {
      background: var(--drop-bg);
    }

    .drop-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--text);
      margin-bottom: 4px;
      opacity: 0.7;
    }

    .drop-subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px;
      opacity: 0.5;
    }

    .drop-border {
      border: 2px dashed var(--drop-border);
      border-radius: 12px;
      padding: 40px 60px;
      transition: border-color 0.2s ease;
    }

    #drop-zone.drag-over .drop-border {
      border-color: var(--link);
    }

    .drop-text {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .drop-hint {
      font-size: 12px;
      opacity: 0.6;
    }

    .drop-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      font-size: 11px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--bg-surface);
    }

    .hidden { display: none !important; }

    /* ===== Markdown Body ===== */
    #markdown-body {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 40px 80px 40px;
      line-height: 1.6;
      word-wrap: break-word;
      transform-origin: top center;
    }

    /* Headings */
    #markdown-body h1 {
      font-size: 2em;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3em;
      margin: 24px 0 16px 0;
      color: var(--heading);
    }

    #markdown-body h2 {
      font-size: 1.5em;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3em;
      margin: 24px 0 16px 0;
      color: var(--heading);
    }

    #markdown-body h3 {
      font-size: 1.25em;
      font-weight: 600;
      margin: 24px 0 16px 0;
      color: var(--heading);
    }

    #markdown-body h4, #markdown-body h5, #markdown-body h6 {
      font-weight: 600;
      margin: 24px 0 16px 0;
      color: var(--heading);
    }

    /* Paragraphs & text */
    #markdown-body p { margin: 0 0 16px 0; }
    #markdown-body strong { font-weight: 600; }
    #markdown-body em { font-style: italic; }
    #markdown-body del { text-decoration: line-through; opacity: 0.7; }

    /* Links */
    #markdown-body a {
      color: var(--link);
      text-decoration: none;
    }
    #markdown-body a:hover { text-decoration: underline; }

    /* Code */
    #markdown-body code {
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
      font-size: 85%;
      padding: 0.2em 0.4em;
      background: var(--code-bg);
      border-radius: 3px;
    }

    #markdown-body pre {
      background: var(--code-bg);
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      margin: 0 0 16px 0;
      border: 1px solid var(--border);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    #markdown-body pre code {
      background: none;
      padding: 0;
      font-size: 85%;
      line-height: 1.5;
    }

    /* Tables */
    #markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 0 0 16px 0;
      display: block;
      overflow-x: auto;
    }

    #markdown-body table th,
    #markdown-body table td {
      border: 1px solid var(--table-border);
      padding: 6px 13px;
      text-align: left;
      transition: border-color 0.2s ease;
    }

    #markdown-body table th {
      font-weight: 600;
      background: var(--bg-surface);
    }

    #markdown-body table tr:nth-child(even) {
      background: var(--table-alt);
    }

    /* Blockquotes */
    #markdown-body blockquote {
      padding: 0 1em;
      border-left: 4px solid var(--blockquote-border);
      color: var(--blockquote-text);
      margin: 0 0 16px 0;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    /* Lists */
    #markdown-body ul, #markdown-body ol {
      padding-left: 2em;
      margin: 0 0 16px 0;
    }
    #markdown-body li + li { margin-top: 4px; }
    #markdown-body li > ul, #markdown-body li > ol { margin: 4px 0 0 0; }

    /* Task lists */
    #markdown-body input[type="checkbox"] {
      margin-right: 6px;
      vertical-align: middle;
    }

    /* Horizontal rules */
    #markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
      transition: border-color 0.2s ease;
    }

    /* Images */
    #markdown-body img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    /* Mermaid diagrams */
    #markdown-body .mermaid {
      background: transparent;
      text-align: center;
      margin: 16px 0;
      border: none;
      padding: 16px 0;
      overflow-x: auto;
    }

    #markdown-body .mermaid svg {
      max-width: 100%;
    }

    /* ===== Editor ===== */
    #editor {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 24px 40px 80px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      overflow-y: auto;
      tab-size: 2;
      transform-origin: top left;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

    /* ===== Platform-specific toolbar padding ===== */
    .platform-darwin #toolbar {
      padding-left: 80px;
    }

    /* ===== Format Toolbar (edit mode only) ===== */
    #format-toolbar {
      display: none;
      align-items: center;
      padding: 4px 12px;
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--toolbar-border);
      flex-shrink: 0;
      min-height: 34px;
      user-select: none;
      -webkit-app-region: no-drag;
      gap: 0;
      overflow-x: auto;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    body.edit-mode #format-toolbar { display: flex; }

    .fmt-group {
      display: flex;
      align-items: center;
      gap: 1px;
      flex-shrink: 0;
    }

    .fmt-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 6px;
      flex-shrink: 0;
    }

    .fmt-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text);
      min-width: 28px;
      height: 26px;
      padding: 0 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
      line-height: 1;
      -webkit-app-region: no-drag;
    }
    .fmt-btn:hover {
      background: var(--bg-surface);
      border-color: var(--border);
    }
    .fmt-btn:active { opacity: 0.7; }

    .fmt-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fmt-btn-bold   { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 800; font-size: 15px; }
    .fmt-btn-italic { font-family: 'Georgia', 'Times New Roman', serif; font-style: italic; font-weight: 600; font-size: 15px; }
    .fmt-btn-strike { font-family: 'Georgia', 'Times New Roman', serif; text-decoration: line-through; font-weight: 600; font-size: 15px; }
    .fmt-btn-h      { font-weight: 700; font-size: 11px; letter-spacing: 0.5px; }

    /* ===== Modal ===== */
    #modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #modal-backdrop.hidden { display: none !important; }

    .modal {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px 16px 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      min-width: 360px;
      max-width: 480px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--heading);
    }

    .modal-body {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 16px;
      line-height: 1.5;
      word-break: break-word;
    }

    .modal-body .modal-path {
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--text-secondary);
      display: block;
      margin-top: 6px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-actions button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    .modal-actions button:hover { background: var(--bg-surface); }
    .modal-actions button.primary {
      background: var(--link);
      border-color: var(--link);
      color: #ffffff;
    }
    .modal-actions button.primary:hover { opacity: 0.9; background: var(--link); }
  </style>
</head>

<body>
  <div id="toolbar" data-tauri-drag-region>
    <div class="toolbar-left">
      <span id="app-brand"><strong>PADD</strong></span>
      <button id="open-btn" title="Open File">Open</button>
      <button id="edit-btn" title="Toggle Edit Mode" disabled>Edit</button>
      <button id="save-btn" title="Save (Ctrl+S)" disabled>Save</button>
    </div>
    <div class="toolbar-right">
      <button class="zoom-btn" id="zoom-out-btn" title="Zoom Out">&#8722;</button>
      <span id="zoom-level">100%</span>
      <button class="zoom-btn" id="zoom-in-btn" title="Zoom In">+</button>
      <button id="theme-btn" title="Toggle Theme">Light</button>
      <button class="win-ctrl" id="win-minimize" title="Minimize">&#x2015;</button>
      <button class="win-ctrl" id="win-maximize" title="Maximize">&#x25A1;</button>
      <button class="win-ctrl win-close" id="win-close" title="Close">&#x2715;</button>
    </div>
  </div>

  <div id="tabbar" class="hidden"></div>

  <div id="format-toolbar">
    <div class="fmt-group">
      <button class="fmt-btn fmt-btn-bold"   data-fmt="bold"   title="Bold (Ctrl+B)">B</button>
      <button class="fmt-btn fmt-btn-italic" data-fmt="italic" title="Italic (Ctrl+I)">I</button>
      <button class="fmt-btn fmt-btn-strike" data-fmt="strike" title="Strikethrough">S</button>
    </div>
    <div class="fmt-sep"></div>
    <div class="fmt-group">
      <button class="fmt-btn fmt-btn-h" data-fmt="h1" title="Heading 1">H1</button>
      <button class="fmt-btn fmt-btn-h" data-fmt="h2" title="Heading 2">H2</button>
      <button class="fmt-btn fmt-btn-h" data-fmt="h3" title="Heading 3">H3</button>
    </div>
    <div class="fmt-sep"></div>
    <div class="fmt-group">
      <button class="fmt-btn" data-fmt="bullet" title="Bullet List">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="6"  r="1.4" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="5" cy="18" r="1.4" fill="currentColor" stroke="none"/><line x1="10" y1="6"  x2="20" y2="6"/><line x1="10" y1="12" x2="20" y2="12"/><line x1="10" y1="18" x2="20" y2="18"/></svg>
      </button>
      <button class="fmt-btn" data-fmt="numbered" title="Numbered List">
        <svg viewBox="0 0 24 24"><text x="2" y="9"  font-size="6" font-family="sans-serif" font-weight="700" fill="currentColor" stroke="none">1.</text><text x="2" y="15" font-size="6" font-family="sans-serif" font-weight="700" fill="currentColor" stroke="none">2.</text><text x="2" y="21" font-size="6" font-family="sans-serif" font-weight="700" fill="currentColor" stroke="none">3.</text><line x1="10" y1="6"  x2="20" y2="6"/><line x1="10" y1="12" x2="20" y2="12"/><line x1="10" y1="18" x2="20" y2="18"/></svg>
      </button>
      <button class="fmt-btn" data-fmt="task" title="Task List">
        <svg viewBox="0 0 24 24"><rect x="3" y="4"  width="6" height="6" rx="1"/><polyline points="4.5,7 5.8,8.3 7.8,5.7"/><rect x="3" y="15" width="6" height="6" rx="1"/><line x1="12" y1="7"  x2="20" y2="7"/><line x1="12" y1="18" x2="20" y2="18"/></svg>
      </button>
    </div>
    <div class="fmt-sep"></div>
    <div class="fmt-group">
      <button class="fmt-btn" data-fmt="quote" title="Blockquote">
        <svg viewBox="0 0 24 24"><path d="M6 9h3a3 3 0 0 1-3 3M14 9h3a3 3 0 0 1-3 3"/><path d="M6 9v6M14 9v6"/></svg>
      </button>
      <button class="fmt-btn" data-fmt="code" title="Inline Code">
        <svg viewBox="0 0 24 24"><polyline points="8,7 4,12 8,17"/><polyline points="16,7 20,12 16,17"/></svg>
      </button>
      <button class="fmt-btn" data-fmt="codeblock" title="Code Block">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><polyline points="9,9 7,12 9,15"/><polyline points="15,9 17,12 15,15"/></svg>
      </button>
    </div>
    <div class="fmt-sep"></div>
    <div class="fmt-group">
      <button class="fmt-btn" data-fmt="link" title="Link (Ctrl+K)">
        <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      </button>
      <button class="fmt-btn" data-fmt="image" title="Image">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><polyline points="5,18 10,13 14,16 19,11 21,13"/></svg>
      </button>
      <button class="fmt-btn" data-fmt="hr" title="Horizontal Rule">
        <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/></svg>
      </button>
      <button class="fmt-btn" data-fmt="mermaid" title="Insert Mermaid Diagram">
        <svg viewBox="0 0 24 24"><rect x="9" y="3"  width="6" height="4" rx="1"/><rect x="3" y="17" width="6" height="4" rx="1"/><rect x="15" y="17" width="6" height="4" rx="1"/><path d="M12 7v4M12 11l-6 6M12 11l6 6"/></svg>
      </button>
    </div>
  </div>

  <div id="content">
    <div id="drop-zone">
      <div class="drop-title">PADD</div>
      <div class="drop-subtitle">Personal Access Display Device</div>
      <div class="drop-border">
        <div class="drop-text">Drop a .md file here to view</div>
        <div class="drop-hint">or press <kbd>Ctrl+O</kbd> to open</div>
      </div>
    </div>
    <article id="markdown-body" class="hidden"></article>
    <textarea id="editor" class="hidden" spellcheck="false"></textarea>
  </div>

  <div id="modal-backdrop" class="hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-title" id="modal-title">Source changed</div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <!-- Libraries (browser builds) -->
  <script src="./lib/marked.min.js"></script>
  <script src="./lib/highlight.min.js"></script>

  <script>
    // ===== Tauri API =====
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;

    // ===== State =====
    let currentZoom = 100;
    let isDark = localStorage.getItem('padd-theme') !== 'light';
    let mermaidReady = false;
    let mermaidLoading = false;

    // Tabs: each tab = { id, filePath, dirUrl, name, content, isDirty, mode, mtime, prompting }
    // mode is 'view' or 'edit'. mtime is ms since epoch (0 = unknown).
    // prompting=true while a source-changed modal is open for this tab.
    const tabs = [];
    let activeTabId = null;
    let nextTabId = 1;

    // DOM refs
    const $tabbar = document.getElementById('tabbar');
    const $content = document.getElementById('content');
    const $dropZone = document.getElementById('drop-zone');
    const $body = document.getElementById('markdown-body');
    const $editor = document.getElementById('editor');
    const $editBtn = document.getElementById('edit-btn');
    const $saveBtn = document.getElementById('save-btn');
    const $modalBackdrop = document.getElementById('modal-backdrop');
    const $modalTitle = document.getElementById('modal-title');
    const $modalBody = document.getElementById('modal-body');
    const $modalActions = document.getElementById('modal-actions');

    // Configure marked for GFM
    marked.use({ gfm: true, breaks: false });

    function highlightCode(code, language) {
      if (language && hljs.getLanguage(language)) {
        try { return hljs.highlight(code, { language }).value; } catch (_) {}
      }
      try { return hljs.highlightAuto(code).value; } catch (_) {}
      return null;
    }

    const platform = navigator.userAgent.includes('Mac') ? 'darwin'
      : navigator.userAgent.includes('Win') ? 'win32'
      : 'linux';

    function loadMermaid() {
      if (mermaidReady || mermaidLoading) return Promise.resolve();
      mermaidLoading = true;
      return new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = './lib/mermaid.min.js';
        script.onload = () => {
          mermaidReady = true;
          mermaid.initialize({
            startOnLoad: false,
            theme: isDark ? 'dark' : 'default',
            securityLevel: 'loose',
            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'
          });
          resolve();
        };
        script.onerror = () => { mermaidLoading = false; resolve(); };
        document.head.appendChild(script);
      });
    }

    // ===== Init =====
    (function init() {
      if (platform === 'darwin') {
        document.body.classList.add('platform-darwin');
        const kbd = document.querySelector('.drop-hint kbd');
        if (kbd) kbd.textContent = '⌘+O';
      }

      if (platform !== 'win32') {
        document.querySelectorAll('.win-ctrl').forEach(el => el.style.display = 'none');
      }

      applyTheme();

      invoke('get_initial_file').then(data => {
        if (data) addOrFocusTab(data);
      }).catch(() => {});
    })();

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-btn').textContent = isDark ? 'Light' : 'Dark';
      document.getElementById('hljs-light').disabled = isDark;
      document.getElementById('hljs-dark').disabled = !isDark;
    }

    // ===== Tab Management =====
    function getActiveTab() {
      return tabs.find(t => t.id === activeTabId) || null;
    }

    function findTabByPath(filePath) {
      if (!filePath) return null;
      return tabs.find(t => t.filePath === filePath) || null;
    }

    function addOrFocusTab(data) {
      const existing = findTabByPath(data.filePath);
      if (existing) {
        switchTab(existing.id);
        // Same-content re-open: silent refresh. Otherwise prompt.
        if (existing.content === data.content) {
          existing.mtime = data.mtime || existing.mtime;
          return existing;
        }
        promptSourceChanged(existing, data.content, data.mtime || 0);
        return existing;
      }
      const tab = {
        id: nextTabId++,
        filePath: data.filePath || '',
        dirUrl: data.dirUrl || '',
        name: data.name || 'untitled',
        content: data.content || '',
        isDirty: false,
        mode: 'view',
        mtime: data.mtime || 0,
        prompting: false,
        viewScroll: 0,
        editorScroll: 0,
        editorCaret: 0,
      };
      tabs.push(tab);
      activeTabId = tab.id;
      renderTabBar();
      renderActiveTab();
      return tab;
    }

    function switchTab(id) {
      if (activeTabId === id) return;
      captureActiveTabState();
      activeTabId = id;
      renderTabBar();
      renderActiveTab();
    }

    function captureActiveTabState() {
      const tab = getActiveTab();
      if (!tab) return;
      if (tab.mode === 'edit') {
        tab.editorCaret = $editor.selectionStart;
        tab.editorScroll = $editor.scrollTop;
      } else {
        tab.viewScroll = $content.scrollTop;
      }
    }

    function closeTab(id) {
      const idx = tabs.findIndex(t => t.id === id);
      if (idx < 0) return;
      const tab = tabs[idx];
      if (tab.isDirty) {
        const ok = confirm(`"${tab.name}" has unsaved changes. Close anyway?`);
        if (!ok) return;
      }
      tabs.splice(idx, 1);
      if (activeTabId === id) {
        const next = tabs[idx] || tabs[idx - 1] || null;
        activeTabId = next ? next.id : null;
      }
      renderTabBar();
      renderActiveTab();
    }

    function renderTabBar() {
      if (tabs.length === 0) {
        $tabbar.classList.add('hidden');
        $tabbar.innerHTML = '';
        return;
      }
      $tabbar.classList.remove('hidden');
      $tabbar.innerHTML = '';
      for (const tab of tabs) {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.id === activeTabId ? ' active' : '') + (tab.isDirty ? ' dirty' : '');
        el.title = tab.filePath || tab.name;
        el.innerHTML = `<span class="tab-name"></span><button class="tab-close" title="Close">×</button>`;
        el.querySelector('.tab-name').textContent = tab.name;
        el.addEventListener('mousedown', (e) => {
          if (e.button === 1) { e.preventDefault(); closeTab(tab.id); return; }
          if (e.target.classList.contains('tab-close')) return;
          switchTab(tab.id);
        });
        el.querySelector('.tab-close').addEventListener('click', (e) => {
          e.stopPropagation();
          closeTab(tab.id);
        });
        $tabbar.appendChild(el);
      }
      const plus = document.createElement('button');
      plus.id = 'new-tab-btn';
      plus.title = 'Open File';
      plus.textContent = '+';
      plus.disabled = openDialogInFlight;
      plus.addEventListener('click', () => openPickedFile().catch(err => console.error(err)));
      $tabbar.appendChild(plus);
    }

    function renderActiveTab() {
      const tab = getActiveTab();
      if (!tab) {
        document.title = 'PADD';
        document.body.classList.remove('edit-mode');
        $body.classList.add('hidden');
        $editor.classList.add('hidden');
        $dropZone.classList.remove('hidden');
        $editBtn.disabled = true;
        $editBtn.textContent = 'Edit';
        $saveBtn.disabled = true;
        return;
      }
      document.title = `${tab.name}${tab.isDirty ? ' •' : ''} · PADD`;
      $editBtn.disabled = false;
      $editBtn.textContent = tab.mode === 'edit' ? 'View' : 'Edit';
      $saveBtn.disabled = !tab.isDirty;
      $dropZone.classList.add('hidden');

      if (tab.mode === 'edit') {
        document.body.classList.add('edit-mode');
        $body.classList.add('hidden');
        $editor.classList.remove('hidden');
        if ($editor.value !== tab.content) $editor.value = tab.content;
        $editor.style.zoom = currentZoom / 100;
        const caret = Math.min(tab.editorCaret || 0, $editor.value.length);
        $editor.setSelectionRange(caret, caret);
        $editor.scrollTop = tab.editorScroll || 0;
        $editor.focus();
      } else {
        document.body.classList.remove('edit-mode');
        $editor.classList.add('hidden');
        $body.classList.remove('hidden');
        renderMarkdown(tab);
      }
    }

    function setActiveTabDirty(dirty) {
      const tab = getActiveTab();
      if (!tab) return;
      const changed = tab.isDirty !== dirty;
      tab.isDirty = dirty;
      $saveBtn.disabled = !dirty;
      document.title = `${tab.name}${dirty ? ' •' : ''} · PADD`;
      if (changed) renderTabBar();
    }

    // ===== Render Markdown =====
    async function renderMarkdown(tab) {
      const html = marked.parse(tab.content);
      $body.innerHTML = html;

      if (tab.dirUrl) {
        $body.querySelectorAll('img').forEach(img => {
          const src = img.getAttribute('src');
          if (src && !src.startsWith('http') && !src.startsWith('data:') && !src.startsWith('file:') && !src.startsWith('asset:') && !src.startsWith('tauri:')) {
            img.src = tab.dirUrl + src;
          }
        });
      }

      $body.querySelectorAll('code.language-mermaid').forEach(codeEl => {
        const pre = codeEl.closest('pre');
        if (!pre) return;
        const div = document.createElement('pre');
        div.className = 'mermaid';
        div.textContent = codeEl.textContent;
        pre.replaceWith(div);
      });

      $body.querySelectorAll('pre code').forEach(el => {
        const langClass = Array.from(el.classList).find(c => c.startsWith('language-'));
        const lang = langClass ? langClass.replace('language-', '') : null;
        if (lang !== 'mermaid') {
          const result = highlightCode(el.textContent, lang);
          if (result) {
            el.innerHTML = result;
            el.classList.add('hljs');
          }
        }
      });

      await renderMermaidDiagrams();

      $body.style.zoom = currentZoom / 100;
      $content.scrollTop = tab.viewScroll || 0;
    }

    async function renderMermaidDiagrams() {
      const elements = document.querySelectorAll('#markdown-body .mermaid');
      if (elements.length === 0) return;

      if (!mermaidReady) {
        await loadMermaid();
        if (!mermaidReady) return;
      }

      elements.forEach(el => {
        if (!el.getAttribute('data-original')) {
          el.setAttribute('data-original', el.textContent.trim());
        }
      });

      elements.forEach(el => {
        const original = el.getAttribute('data-original');
        if (original) {
          el.removeAttribute('data-processed');
          el.innerHTML = original;
        }
      });

      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? 'dark' : 'default',
        securityLevel: 'loose',
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'
      });

      try {
        mermaid.init(undefined, '#markdown-body .mermaid');
      } catch (e) {
        console.warn('Mermaid rendering error:', e);
      }
    }

    function toggleTheme() {
      isDark = !isDark;
      localStorage.setItem('padd-theme', isDark ? 'dark' : 'light');
      applyTheme();
      const tab = getActiveTab();
      if (tab && tab.mode === 'view') renderMermaidDiagrams();
    }

    function setZoom(level, cursorX, cursorY) {
      const oldZoom = currentZoom;
      currentZoom = Math.max(50, Math.min(400, level));
      document.getElementById('zoom-level').textContent = currentZoom + '%';

      const tab = getActiveTab();
      if (!tab) return;

      if (tab.mode === 'edit') {
        $editor.style.zoom = currentZoom / 100;
        return;
      }

      if (cursorX !== undefined && cursorY !== undefined && oldZoom !== currentZoom) {
        const contentRect = $content.getBoundingClientRect();
        const mx = cursorX - contentRect.left;
        const my = cursorY - contentRect.top;
        const docX = ($content.scrollLeft + mx) / (oldZoom / 100);
        const docY = ($content.scrollTop + my) / (oldZoom / 100);
        $body.style.zoom = currentZoom / 100;
        $content.scrollLeft = docX * (currentZoom / 100) - mx;
        $content.scrollTop = docY * (currentZoom / 100) - my;
      } else {
        $body.style.zoom = currentZoom / 100;
      }
    }

    // ===== Open / Save =====
    let openDialogInFlight = false;
    function setOpenButtonsDisabled(disabled) {
      const openBtn = document.getElementById('open-btn');
      if (openBtn) openBtn.disabled = disabled;
      const plus = document.getElementById('new-tab-btn');
      if (plus) plus.disabled = disabled;
    }
    async function openPickedFile() {
      if (openDialogInFlight) return;
      openDialogInFlight = true;
      setOpenButtonsDisabled(true);
      try {
        const data = await invoke('open_file_dialog');
        if (data) addOrFocusTab(data);
      } finally {
        // Defer unlock past the next macrotask tick. WebView2 can queue
        // clicks at the OS input layer while the file dialog is open (window
        // is unfocused) and dispatch them as DOM clicks *after* the dialog
        // closes. Without this delay, that queued click sees a re-enabled
        // button and opens a second dialog. The timeout lets queued events
        // drain against the still-locked state.
        setTimeout(() => {
          openDialogInFlight = false;
          setOpenButtonsDisabled(false);
        }, 250);
      }
    }

    async function saveActiveTab() {
      const tab = getActiveTab();
      if (!tab || !tab.isDirty || !tab.filePath) return;
      const wasEdit = tab.mode === 'edit';
      const caret = wasEdit ? $editor.selectionStart : null;
      const scroll = wasEdit ? $editor.scrollTop : null;
      try {
        await invoke('save_file', { filePath: tab.filePath, content: tab.content });
        setActiveTabDirty(false);
        // Refresh mtime so the watcher doesn't false-trigger from our own save.
        try {
          tab.mtime = await invoke('get_mtime', { filePath: tab.filePath });
        } catch (_) {}
        // Restore focus + caret/scroll lost when the Save button took focus.
        if (wasEdit) {
          $editor.focus();
          if (caret !== null) $editor.setSelectionRange(caret, caret);
          if (scroll !== null) $editor.scrollTop = scroll;
          tab.editorCaret = caret || 0;
          tab.editorScroll = scroll || 0;
        }
      } catch (e) {
        console.error('Save failed:', e);
        alert('Failed to save: ' + e);
      }
    }

    function toggleEditMode() {
      const tab = getActiveTab();
      if (!tab) return;
      captureActiveTabState();
      tab.mode = tab.mode === 'edit' ? 'view' : 'edit';
      renderActiveTab();
    }

    // ===== Format transforms (pure; tested in tests/format.test.js) =====
    function wrapText(value, start, end, prefix, suffix, placeholder) {
      const before = value.slice(0, start);
      const selected = value.slice(start, end);
      const after = value.slice(end);
      // Toggle-off: if selection (or surrounding text) is already wrapped, unwrap it.
      if (selected.startsWith(prefix) && selected.endsWith(suffix) && selected.length >= prefix.length + suffix.length) {
        const inner = selected.slice(prefix.length, selected.length - suffix.length);
        return {
          value: before + inner + after,
          start: start,
          end: start + inner.length,
        };
      }
      if (before.endsWith(prefix) && after.startsWith(suffix)) {
        return {
          value: before.slice(0, before.length - prefix.length) + selected + after.slice(suffix.length),
          start: start - prefix.length,
          end: end - prefix.length,
        };
      }
      if (selected) {
        return {
          value: before + prefix + selected + suffix + after,
          start: start + prefix.length,
          end: start + prefix.length + selected.length,
        };
      }
      const ins = prefix + placeholder + suffix;
      return {
        value: before + ins + after,
        start: start + prefix.length,
        end: start + prefix.length + placeholder.length,
      };
    }

    function prefixLines(value, start, end, prefix) {
      const lineStart = value.lastIndexOf('\n', start - 1) + 1;
      // Selection covers lines [lineStart..end). Find each line's start within range.
      const region = value.slice(lineStart, end);
      const lines = region.split('\n');
      // Toggle off if every non-empty line already starts with prefix.
      const allHavePrefix = lines.every((ln) => ln === '' || ln.startsWith(prefix));
      let newRegion;
      let delta;
      if (allHavePrefix) {
        newRegion = lines.map((ln) => (ln.startsWith(prefix) ? ln.slice(prefix.length) : ln)).join('\n');
        delta = -prefix.length * lines.filter((ln) => ln.startsWith(prefix)).length;
      } else {
        newRegion = lines.map((ln) => prefix + ln).join('\n');
        delta = prefix.length * lines.length;
      }
      const newValue = value.slice(0, lineStart) + newRegion + value.slice(end);
      // Shift the caret/selection by the prefix on the FIRST line (so caret stays near where it was).
      const firstLineDelta = allHavePrefix
        ? (lines[0].startsWith(prefix) ? -prefix.length : 0)
        : prefix.length;
      const newStart = Math.max(lineStart, start + firstLineDelta);
      const newEnd = end + delta;
      return { value: newValue, start: newStart, end: newEnd };
    }

    function insertBlock(value, start, end, block, cursorOffsetFromBlockStart, selectLen) {
      const before = value.slice(0, start);
      const after = value.slice(end);
      const needLead = before.length > 0 && !before.endsWith('\n');
      const needTrail = after.length > 0 && !after.startsWith('\n');
      const lead = needLead ? '\n' : '';
      const trail = needTrail ? '\n' : '';
      const full = lead + block + trail;
      const newValue = before + full + after;
      const caret = before.length + lead.length + cursorOffsetFromBlockStart;
      return {
        value: newValue,
        start: caret,
        end: caret + (selectLen || 0),
      };
    }

    function applyFormat(name, value, start, end) {
      const sel = value.slice(start, end);
      switch (name) {
        case 'bold':       return wrapText(value, start, end, '**', '**', 'bold text');
        case 'italic':     return wrapText(value, start, end, '*',  '*',  'italic text');
        case 'strike':     return wrapText(value, start, end, '~~', '~~', 'text');
        case 'code':       return wrapText(value, start, end, '`',  '`',  'code');
        case 'h1':         return prefixLines(value, start, end, '# ');
        case 'h2':         return prefixLines(value, start, end, '## ');
        case 'h3':         return prefixLines(value, start, end, '### ');
        case 'bullet':     return prefixLines(value, start, end, '- ');
        case 'numbered':   return prefixLines(value, start, end, '1. ');
        case 'task':       return prefixLines(value, start, end, '- [ ] ');
        case 'quote':      return prefixLines(value, start, end, '> ');
        case 'link':
          if (sel && /^https?:\/\//i.test(sel)) {
            return wrapText(value, start, end, '[text](', ')', sel);
          }
          return wrapText(value, start, end, '[', '](url)', 'link text');
        case 'image':      return wrapText(value, start, end, '![', '](image-url)', 'alt text');
        case 'codeblock':
          if (sel) {
            return insertBlock(value, start, end, '```\n' + sel + '\n```', 4, sel.length);
          }
          return insertBlock(value, start, end, '```\ncode\n```', 4, 4);
        case 'mermaid':
          if (sel) {
            return insertBlock(value, start, end, '```mermaid\n' + sel + '\n```', 11, sel.length);
          }
          return insertBlock(value, start, end, '```mermaid\ngraph TD\n  A --> B\n```', 11, 8);
        case 'hr':         return insertBlock(value, start, end, '---', 3, 0);
        default:           return { value, start, end };
      }
    }
    // Smallest contiguous edit that turns oldValue into newValue.
    // Used so format operations apply via execCommand('insertText'), which
    // pushes the change into the textarea undo stack (Ctrl+Z works).
    function computeMinimalDiff(oldValue, newValue) {
      if (oldValue === newValue) return null;
      let prefixLen = 0;
      const minLen = Math.min(oldValue.length, newValue.length);
      while (prefixLen < minLen && oldValue[prefixLen] === newValue[prefixLen]) prefixLen++;
      let suffixLen = 0;
      while (
        suffixLen < (minLen - prefixLen) &&
        oldValue[oldValue.length - 1 - suffixLen] === newValue[newValue.length - 1 - suffixLen]
      ) suffixLen++;
      return {
        replaceStart: prefixLen,
        replaceEnd: oldValue.length - suffixLen,
        replacement: newValue.slice(prefixLen, newValue.length - suffixLen),
      };
    }
    // Expose for tests
    window.applyFormat = applyFormat;
    window.computeMinimalDiff = computeMinimalDiff;
    window.__paddTest = { get runFormat() { return runFormat; }, get addOrFocusTab() { return addOrFocusTab; }, get getActiveTab() { return getActiveTab; } };

    function runFormat(name) {
      const tab = getActiveTab();
      if (!tab || tab.mode !== 'edit') return;
      const oldValue = $editor.value;
      const r = applyFormat(name, oldValue, $editor.selectionStart, $editor.selectionEnd);
      if (r.value === oldValue) return;
      const diff = computeMinimalDiff(oldValue, r.value);
      if (!diff) return;

      $editor.focus();
      $editor.setSelectionRange(diff.replaceStart, diff.replaceEnd);
      // execCommand is "deprecated" but it's still the ONLY way to push an
      // edit into the native textarea undo stack. Without it, Ctrl+Z would
      // skip past format operations.
      const ok = document.execCommand('insertText', false, diff.replacement);
      if (!ok) {
        // Fallback for environments where execCommand fails (edit still works,
        // but won't be undoable in those environments).
        $editor.value = r.value;
        $editor.dispatchEvent(new Event('input', { bubbles: true }));
      }
      $editor.setSelectionRange(r.start, r.end);
      // (the 'input' event from execCommand triggers the listener that
      // updates tab.content and dirty state — no manual sync needed.)
    }

    // ===== Modal =====
    function showModal({ title, body, actions }) {
      $modalTitle.textContent = title;
      if (typeof body === 'string') {
        $modalBody.textContent = body;
      } else {
        $modalBody.innerHTML = '';
        $modalBody.appendChild(body);
      }
      $modalActions.innerHTML = '';
      for (const a of actions) {
        const btn = document.createElement('button');
        btn.textContent = a.label;
        if (a.primary) btn.classList.add('primary');
        btn.addEventListener('click', () => {
          hideModal();
          a.onClick && a.onClick();
        });
        $modalActions.appendChild(btn);
      }
      $modalBackdrop.classList.remove('hidden');
      const primary = $modalActions.querySelector('button.primary')
        || $modalActions.querySelector('button');
      if (primary) primary.focus();
    }

    function hideModal() {
      $modalBackdrop.classList.add('hidden');
    }

    function promptSourceChanged(tab, newContent, newMtime) {
      if (tab.prompting) return;
      tab.prompting = true;

      const dirtyNote = tab.isDirty
        ? 'You have unsaved edits in this tab. Reloading will discard them.'
        : 'The file changed on disk.';

      const body = document.createElement('div');
      body.textContent = `Hey dude... ummm source changed. ${dirtyNote}`;
      const pathEl = document.createElement('span');
      pathEl.className = 'modal-path';
      pathEl.textContent = tab.filePath;
      body.appendChild(pathEl);

      showModal({
        title: 'Source changed',
        body,
        actions: [
          {
            label: 'Keep my version',
            onClick: () => {
              tab.prompting = false;
              // Adopt the new mtime so we don't re-prompt for this same change.
              if (newMtime) tab.mtime = newMtime;
            },
          },
          {
            label: 'Reload from disk',
            primary: true,
            onClick: () => {
              tab.content = newContent;
              tab.isDirty = false;
              if (newMtime) tab.mtime = newMtime;
              tab.prompting = false;
              if (tab.id === activeTabId) {
                if (tab.mode === 'edit') $editor.value = tab.content;
                renderActiveTab();
              }
              renderTabBar();
            },
          },
        ],
      });
    }

    // ===== File-change poller =====
    let pollInFlight = false;
    async function pollFileChanges() {
      if (pollInFlight) return;
      pollInFlight = true;
      try {
        for (const tab of tabs) {
          if (!tab.filePath || tab.prompting) continue;
          let mtime;
          try {
            mtime = await invoke('get_mtime', { filePath: tab.filePath });
          } catch (_) { continue; }
          if (!tab.mtime) { tab.mtime = mtime; continue; }
          if (mtime > tab.mtime) {
            // File changed on disk — read it and prompt.
            try {
              const data = await invoke('read_file', { filePath: tab.filePath });
              if (data && data.content !== tab.content) {
                promptSourceChanged(tab, data.content, data.mtime || mtime);
              } else {
                tab.mtime = mtime; // content identical, just absorb the new mtime
              }
            } catch (e) {
              console.warn('Failed to re-read changed file:', e);
            }
          }
        }
      } finally {
        pollInFlight = false;
      }
    }
    setInterval(pollFileChanges, 1500);

    // ===== Event Listeners =====
    document.getElementById('win-minimize').addEventListener('click', () => invoke('minimize_window'));
    document.getElementById('win-maximize').addEventListener('click', () => invoke('maximize_window'));
    document.getElementById('win-close').addEventListener('click', () => invoke('close_window'));

    document.getElementById('open-btn').addEventListener('click', () => {
      openPickedFile().catch(err => console.error('Failed to open file:', err));
    });
    document.getElementById('zoom-in-btn').addEventListener('click', () => setZoom(currentZoom + 10));
    document.getElementById('zoom-out-btn').addEventListener('click', () => setZoom(currentZoom - 10));
    document.getElementById('theme-btn').addEventListener('click', toggleTheme);
    $editBtn.addEventListener('click', toggleEditMode);
    $saveBtn.addEventListener('click', () => saveActiveTab());

    // Format toolbar — single delegated click handler
    document.getElementById('format-toolbar').addEventListener('click', (e) => {
      const btn = e.target.closest('.fmt-btn');
      if (!btn) return;
      const name = btn.getAttribute('data-fmt');
      if (name) runFormat(name);
    });

    // Prevent textarea from losing focus on toolbar mousedown (so selection survives)
    document.getElementById('format-toolbar').addEventListener('mousedown', (e) => {
      if (e.target.closest('.fmt-btn')) e.preventDefault();
    });

    $editor.addEventListener('input', () => {
      const tab = getActiveTab();
      if (!tab) return;
      tab.content = $editor.value;
      tab.editorCaret = $editor.selectionStart;
      tab.editorScroll = $editor.scrollTop;
      setActiveTabDirty(true);
    });

    $editor.addEventListener('scroll', () => {
      const tab = getActiveTab();
      if (tab && tab.mode === 'edit') tab.editorScroll = $editor.scrollTop;
    });

    function captureEditorCaret() {
      const tab = getActiveTab();
      if (tab && tab.mode === 'edit') tab.editorCaret = $editor.selectionStart;
    }
    $editor.addEventListener('click', captureEditorCaret);
    $editor.addEventListener('keyup', captureEditorCaret);
    $editor.addEventListener('select', captureEditorCaret);

    $content.addEventListener('scroll', () => {
      const tab = getActiveTab();
      if (tab && tab.mode === 'view') tab.viewScroll = $content.scrollTop;
    });

    // IPC from Tauri backend (also fired by single-instance with new file)
    listen('file-opened', (event) => {
      addOrFocusTab(event.payload);
    });

    listen('zoom', (event) => {
      const direction = event.payload;
      if (direction === 'in') setZoom(currentZoom + 10);
      else if (direction === 'out') setZoom(currentZoom - 10);
      else setZoom(100);
    });

    listen('toggle-theme', () => toggleTheme());

    // Tauri drag & drop
    const appWindow = getCurrentWindow();
    appWindow.onDragDropEvent(async (event) => {
      if (event.payload.type === 'over') {
        $dropZone.classList.add('drag-over');
      } else if (event.payload.type === 'cancel' || event.payload.type === 'leave') {
        $dropZone.classList.remove('drag-over');
      } else if (event.payload.type === 'drop') {
        $dropZone.classList.remove('drag-over');
        const paths = event.payload.paths || [];
        for (const path of paths) {
          if (!/\.(md|markdown)$/i.test(path)) continue;
          try {
            const result = await invoke('read_file', { filePath: path });
            if (result) addOrFocusTab(result);
          } catch (e) {
            console.error('Failed to read dropped file:', e);
          }
        }
      }
    });

    // Ctrl+Mousewheel zoom towards cursor (view mode only)
    $content.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      const tab = getActiveTab();
      if (tab && tab.mode === 'edit') return;
      e.preventDefault();
      const step = e.deltaY < 0 ? 10 : -10;
      setZoom(currentZoom + step, e.clientX, e.clientY);
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (!mod) return;
      if (e.key === '=' || e.key === '+') { e.preventDefault(); setZoom(currentZoom + 10); }
      else if (e.key === '-') { e.preventDefault(); setZoom(currentZoom - 10); }
      else if (e.key === '0') { e.preventDefault(); setZoom(100); }
      else if (e.key === 'o' || e.key === 'O') {
        e.preventDefault();
        openPickedFile().catch(err => console.error('Failed to open file:', err));
      } else if (e.key === 's' || e.key === 'S') {
        e.preventDefault();
        saveActiveTab();
      } else if (e.key === 'e' || e.key === 'E') {
        if (e.shiftKey) return; // allow ctrl+shift+E for other things
        e.preventDefault();
        toggleEditMode();
      } else if (e.key === 'w' || e.key === 'W') {
        e.preventDefault();
        if (activeTabId !== null) closeTab(activeTabId);
      } else if (e.key === 'Tab') {
        // Ctrl+Tab cycles tabs
        if (tabs.length < 2) return;
        e.preventDefault();
        const idx = tabs.findIndex(t => t.id === activeTabId);
        const dir = e.shiftKey ? -1 : 1;
        const nextIdx = (idx + dir + tabs.length) % tabs.length;
        switchTab(tabs[nextIdx].id);
      } else if (e.key === 'b' || e.key === 'B') {
        const tab = getActiveTab();
        if (!tab || tab.mode !== 'edit') return;
        e.preventDefault();
        runFormat('bold');
      } else if (e.key === 'i' || e.key === 'I') {
        const tab = getActiveTab();
        if (!tab || tab.mode !== 'edit') return;
        e.preventDefault();
        runFormat('italic');
      } else if (e.key === 'k' || e.key === 'K') {
        const tab = getActiveTab();
        if (!tab || tab.mode !== 'edit') return;
        e.preventDefault();
        runFormat('link');
      }
    });
  </script>
</body>
</html>
